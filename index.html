<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/sandbox/" />
  <title>Sandbox</title>
  <meta name="description" content="A full-stack single-page web application utilizing SQLite WASM + OPFS + web worker setup, powered by Bun.">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple_touch_icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./index.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service.worker.js', { scope: './' })
          .catch((err) => console.error('ServiceWorker registration failed: ', err));
      });
    }
  </script>
  <script type="module" src="./index.js" defer></script>
</head>
<body>
  <div id="app">
    <div id="header_slot"></div>
    <div id="view_slot"></div>
  </div>
</body>
</html>
